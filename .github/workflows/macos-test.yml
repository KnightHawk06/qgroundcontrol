name: macOS Test Build

on:
  push:
    branches:
      - issue-7133-macos-test
  pull_request:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          which cmake || true
          cmake --version
          brew --version
          uname -a

      - name: Install dependencies (no cmake)
        run: |
          brew update
          brew install ninja qt@6
          echo "Qt prefix: $(brew --prefix qt@6)"

      - name: Configure (CMake + Qt6)
        run: |
          mkdir build
          cd build
          cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)"

      - name: Build
        run: |
          cd build
          ninja -v
