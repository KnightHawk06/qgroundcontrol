name: macOS Test Build

on:
  push:
    branches:
      - issue-7133-macos-test
  pull_request:

env:
  QT_VERSION: "6.5.3"

jobs:
  build-macos:
    if: github.ref == 'refs/heads/issue-7133-macos-test'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (isolated; avoids PEP 668)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Toolchain info
        run: |
          set -eux
          uname -a
          which cmake || true
          cmake --version || true
          which ninja || true
          ninja --version || true
          python3 --version

      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: ~/Qt
          key: qt-${{ runner.os }}-${{ env.QT_VERSION }}

      - name: Install aqtinstall
        run: |
          set -eux
          python3 -m pip install --upgrade pip
          python3 -m pip install aqtinstall

      - name: Determine Qt arch (prefer clang_64) and list modules
        id: qarch
        run: |
          set -eux
          # Query available architectures for the requested Qt version
          if python3 -m aqt list-qt mac desktop --arch "${QT_VERSION}" > arch.txt 2>/dev/null; then
            cat arch.txt
            if grep -qx "clang_64" arch.txt; then
              Q_ARCH="clang_64"
            else
              Q_ARCH="$(head -n1 arch.txt)"
            fi
          else
            # Fallback to clang_64 if listing fails
            Q_ARCH="clang_64"
          fi
          echo "Using Qt arch: ${Q_ARCH}"
          echo "Q_ARCH=${Q_ARCH}" >> "$GITHUB_OUTPUT"
          # List available modules for visibility (non-fatal)
          python3 -m aqt list-qt mac desktop --modules "${QT_VERSION}" "${Q_ARCH}" || true

      - name: Install Qt (aqt, no Homebrew)
        env:
          Q_ARCH: ${{ steps.qarch.outputs.Q_ARCH }}
        run: |
          set -eux
          QT_DIR="$HOME/Qt/${QT_VERSION}/macos"   # aqt lays mac desktop Qt out under 'macos'
          if [ ! -d "$QT_DIR" ]; then
            WANT="qtdeclarative qtquickcontrols2 qtpositioning qtserialport qtmultimedia qtsvg qtlocation qtshadertools qtimageformats qt5compat"
            AVAIL="$(python3 -m aqt list-qt mac desktop --modules "${QT_VERSION}" "${Q_ARCH}" | tr -s ' ' '\n' | sed 's/\r$//' || true)"
            HAVE=""
            for m in $WANT; do
              if echo "$AVAIL" | grep -q "^${m}$"; then
                HAVE="$HAVE $m"
              fi
            done
            if [ -n "$HAVE" ]; then
              echo "Installing Qt ${QT_VERSION} ${Q_ARCH} with modules:$HAVE"
              python3 -m aqt install-qt mac desktop "${QT_VERSION}" "${Q_ARCH}" -O "$HOME/Qt" -m $HAVE
            else
              echo "Installing core Qt ${QT_VERSION} ${Q_ARCH}"
              python3 -m aqt install-qt mac desktop "${QT_VERSION}" "${Q_ARCH}" -O "$HOME/Qt"
            fi
          fi
          ls -la "$QT_DIR"
          ls -la "$QT_DIR/bin" || true
          "$QT_DIR/bin/qmake" -v || true

      - name: Ensure Ninja (no Homebrew)
        run: |
          set -eux
          ninja --version || python3 -m pip install ninja

      - name: Configure (CMake + Qt6)
        env:
          CMAKE_PREFIX_PATH: ${{ runner.home }}/Qt/${{ env.QT_VERSION }}/macos
        run: |
          set -eux
          mkdir -p build
          cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          set -eux
          cd build
          ninja -v
