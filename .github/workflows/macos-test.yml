name: macOS QGroundControl Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Homebrew deps
        shell: bash
        run: |
          brew update
          # QGC’s script installs what it needs (gstreamer, etc.)
          bash tools/setup/macos-dependencies.sh
          brew install ninja create-dmg ccache

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: 'true'

      - name: Configure (CMake + Ninja)
        shell: bash
        run: |
          qt-cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: Install (stage .app)
        shell: bash
        run: cmake --install build --config Release --prefix "$PWD/dist"

      - name: Package DMG
        shell: bash
        run: |
          cd dist
          create-dmg --overwrite QGroundControl-macos-Release.dmg QGroundControl.app

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QGroundControl-macos-Release
          path: |
            dist/QGroundControl.app
            dist/QGroundControl-macos-Release.dmg
